name: Mustang Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mustang-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Tests, lint and APK build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Package
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Mustang-Player.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/player-tests.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mustang-APK
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-reports
          path: app/build/reports/
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Mustang-APK
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 playback tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/device-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Device-checks
          path: device-checks/
  release:
    needs: [build, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Mustang-APK
          path: dist
      - name: Release one installable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: mustang-build-${{ github.run_number }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: gh release create "$RELEASE_TAG" dist/Mustang-Player.apk --target "$RELEASE_COMMIT" --title 'Mustang Player 1.0.0' --notes 'Music and video, language filters, background audio, picture-in-picture, auto-next, auto-scroll, synced lyrics and source quality switching. Original bundled demos included. Debug-signed Android 8+ APK. Unit tests, lint and Android 15 playback tests passed.' --latest
